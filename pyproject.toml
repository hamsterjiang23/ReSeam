[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reseam"
version = "0.1.0"
description = "Reversible seam restructuring experiments for fixed meshes"
requires-python = ">=3.11"
dependencies = ["numpy>=2.2,<3", "scipy>=1.15,<2", "trimesh>=4.9,<5", "pillow>=11,<13", "shapely>=2.1,<3", "xatlas==0.0.11"]

[project.scripts]
reseam = "reseam.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12", "basedpyright>=1.30"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.basedpyright]
typeCheckingMode = "basic"
include = ["src/reseam"]
reportMissingTypeStubs = false
